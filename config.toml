base_url = "https://carolinasregionalexplorer.com"
title = "Carolinas Regional Explorer"
description = "Data-driven insights for communities across North and South Carolina."
compile_sass = true
build_search_index = true

taxonomies = [
  { name = "tags", feed = true, render = true },
]

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
events = [
  { title = "Data Story Workshop", date = "August 5, 2026", description = "A hands-on session on turning raw datasets into compelling public narratives. Open to collaborators and contributors to the Explorer project.", link = "https://example.com/register-workshop", link_label = "Register for the event" },
  { title = "The new event", date = "September 17, 2026", description = "This is a new event", link = "https://example.com/register-workshop", link_label = "Register for the event" },
]

[extra.footer]
tagline_1    = "A short mission line shown under the logo."
tagline_2    = "A second line with context."
email        = "changed@carolinasregionalexplorer.com"
address      = "A line with a physical address or location."
hours        = "A line with office hours or response time."
copyright    = "2026 Carolinas Regional Explorer"
credit_text  = "Built by"
credit_link  = "/about/"
credit_label = "the project team"

[extra.newsletter]
eyebrow = "New netsletter text"
title   = "Join our newsletter"
button  = "Sign up"
# Mailchimp embedded-form action URL, e.g.:
#   https://<region>.list-manage.com/subscribe/post?u=<user_id>&amp;id=<list_id>
# Get this from Mailchimp: Audience > Signup forms > Embedded form. Leave blank
# until then — the form renders but does not submit anywhere.
mailchimp_action = ""
# The honeypot field name Mailchimp generates alongside the action URL, of the
# form "b_<user_id>_<list_id>". Required to silence bots; comes from the same
# embedded form snippet as mailchimp_action above.
mailchimp_honeypot = ""

[extra.embeds]
map        = "https://crxp.netlify.app/explore/?topnav=1"
map_origin = "https://crxp.netlify.app"
survey     = "https://clinquant-licorice-aeeff9.netlify.app/embed"


name: Validate stories

# Render the Quarto stories from scratch to prove they build. Commits nothing — this
# is the gate for pull requests into main, and is reused by render-stories.yml before
# it auto-commits on push.

on:
  pull_request:
    branches: [main]
    paths:
      - 'quarto/**'
      - 'scripts/build-stories.sh'
      - 'sass/_tokens.scss'
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto story toolchain
        uses: ./.github/actions/setup-stories

      # --force drops the freeze cache so every story re-executes its R from scratch;
      # build-stories.sh runs with `set -euo pipefail`, so any render error fails the job.
      - name: Render stories (validation only)
        run: scripts/build-stories.sh --force

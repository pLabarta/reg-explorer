<div class="about-section about-section--white">
  <div class="container">
    <p class="eyebrow">{{ config.extra.newsletter.eyebrow }}</p>
    <div class="newsletter-row">
      <h2 class="newsletter-title">{{ config.extra.newsletter.title }}</h2>
      {% if config.extra.newsletter.mailchimp_action %}
      <form class="newsletter-form" action="{{ config.extra.newsletter.mailchimp_action }}" method="post" target="_blank" novalidate>
        <div class="newsletter-form-row">
          <input class="newsletter-input" type="email" name="EMAIL" placeholder="Your email address" required>
          <button class="btn btn-primary" type="submit">{{ config.extra.newsletter.button }}</button>
        </div>
        {# Mailchimp bot honeypot: real users never see or fill this field. #}
        <div style="position: absolute; left: -5000px;" aria-hidden="true">
          <input type="text" name="{{ config.extra.newsletter.mailchimp_honeypot }}" tabindex="-1" value="">
        </div>
      </form>
      {% else %}
      <form class="newsletter-form" action="#" method="post">
        <div class="newsletter-form-row">
          <input class="newsletter-input" type="email" name="email" placeholder="Your email address" required disabled>
          <button class="btn btn-primary" type="submit" disabled>{{ config.extra.newsletter.button }}</button>
        </div>
      </form>
      {% endif %}
    </div>
  </div>
</div>

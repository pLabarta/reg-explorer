<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description | default(value="") }}{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/main.css">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="/" class="nav-brand">
          <svg class="nav-logo" width="26" height="32" viewBox="0 0 198 248.84" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            {# UNCC logo (static/imgs/uncc-logo.svg), recolored to the site palette #}
            <path d="m106.17 132.41c-3.9259 29.372-4.1444 58.744-3.7079 87.898-15.704-26.319-23.774-55.618-21.811-86.662l-4.7984 0.21802c-0.94542 0.0729-1.5995-0.50898-1.745-1.3085l-9.1608 0.43603c-0.94501 0.0729-1.5995-0.65405-1.381-1.5265l7.6339-22.684c0.14507-0.79994 1.0175-1.454 1.89-1.454l4.7984 0.50857c0.3635-0.79953 1.236-1.381 2.1814-1.381l4.7255 0.21802c7.6339-31.044 24.719-60.344 48.566-86.663-9.4513 29.154-18.249 58.526-23.411 87.899l6.6888 2.7625 63.979-3.126c0.94542-0.0729 1.8179-0.65446 1.963-1.5995 3.9989-23.193 9.1608-49.075 14.032-72.049 0.21801-1.1634 0-2.1814-0.72741-3.1264-6.0344-7.3429-11.996-14.759-17.958-22.32-0.727-0.94501-1.8175-1.454-3.126-1.454-36.643-1.8175-73.431-3.5624-110.15-5.3074-1.236-0.072658-2.4719 0.3635-3.5624 1.236-9.3063 7.1978-18.54 14.541-27.7 21.957-1.163 0.94501-1.8175 2.0355-2.108 3.2715-13.087 63.907-22.975 128.54-29.59 193.61-0.14548 1.3085 0.21802 2.399 1.0905 3.2715 6.9069 7.3429 13.814 14.686 20.721 21.884 0.727 0.79994 3.1989 0.58192 3.1989 0.58192h106.22s2.69-0.58192 3.5624-1.454c8.2879-7.8523 21.084-20.794 29.517-28.427 1.018-0.94501 1.5995-4.2165 1.745-5.4525 1.8175-16.286 3.8534-32.571 6.1069-48.784 0.29096-1.963 0.58193-3.9264 0.79994-5.9618 1.0905-7.5613 2.399-15.777 3.635-23.411 0.29097-1.5995-1.018-2.9809-2.6174-3.0535l-62.016-1.0905z" fill="#ACA493"/>
          </svg>
          <span>Carolinas Regional Explorer</span>
        </a>
        <ul class="nav-menu" id="nav-menu">
          <li>
            <a href="/map/"
              {% if current_path == "/map/" %}class="is-active"{% endif %}>
              Regional map
            </a>
          </li>
          <li class="nav-dropdown" id="nav-dropdown">
            <button type="button" class="nav-dropdown-toggle{% if current_path == "/survey/" or current_path == "/report/" %} is-active{% endif %}"
              id="nav-dropdown-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="nav-dropdown-menu">
              Wellbeing Survey
              <svg class="nav-dropdown-caret" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true">
                <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="nav-dropdown-menu" id="nav-dropdown-menu">
              <a href="/survey/"
                {% if current_path == "/survey/" %}class="is-active"{% endif %}>
                Dashboard
              </a>
              <a href="/report/"
                {% if current_path == "/report/" %}class="is-active"{% endif %}>
                Report
              </a>
            </div>
          </li>
          <li>
            <a href="/stories/"
              {% if current_path == "/stories/" %}class="is-active"{% endif %}>
              Data stories
            </a>
          </li>
          <li>
            <a href="/about/"
              {% if current_path == "/about/" %}class="is-active"{% endif %}>
              About
            </a>
          </li>
          <li>
            <a href="/collaborate/"
              {% if current_path == "/collaborate/" %}class="is-active"{% endif %}>
              Collaborate
            </a>
          </li>
        </ul>
        <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-menu">
          <span></span><span></span><span></span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  {% block footer %}
  {% include "partials/footer.html" %}
  {% endblock %}

  {% block scripts %}{% endblock %}
  <script>
    var btn = document.getElementById('nav-hamburger');
    var menu = document.getElementById('nav-menu');
    btn.addEventListener('click', function() {
      var open = menu.classList.toggle('is-open');
      btn.classList.toggle('is-open', open);
      btn.setAttribute('aria-expanded', open);
    });

    var dropdown = document.getElementById('nav-dropdown');
    var dropdownToggle = document.getElementById('nav-dropdown-toggle');
    dropdownToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      var open = dropdown.classList.toggle('is-open');
      dropdownToggle.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', function(e) {
      if (!dropdown.contains(e.target)) {
        dropdown.classList.remove('is-open');
        dropdownToggle.setAttribute('aria-expanded', false);
      }
    });
  </script>
</body>
</html>
